{% extends "base.html" %}
{% block head_title %}Tussilago{% endblock %}
{% block content %}
    <div class="py-5 text-center">
        <h1 class="display-4 fw-semibold">Tussilago</h1>
        <p class="lead text-body-secondary mb-4">A platform to run and host applications.</p>
        {% if user.is_authenticated %}
            <a class="btn btn-primary btn-lg" href="{% url 'organizations' %}">Go to Organizations</a>
        {% else %}
            <div class="d-flex justify-content-center gap-2">
                <a class="btn btn-primary btn-lg" href="{% url 'account_signup' %}">Get Started</a>
                <a class="btn btn-outline-secondary btn-lg"
                   href="{% url 'account_login' %}">Log In</a>
            </div>
        {% endif %}
    </div>
{% endblock content %}
