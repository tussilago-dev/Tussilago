<nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'index' %}">Tussilago</a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarToggler"
                aria-controls="navbarToggler"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarToggler">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'organizations' %}active{% endif %}"
                       href="{% url 'organizations' %}">Organizations</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <form class="d-flex" role="search">
                    <input class="form-control"
                           type="search"
                           placeholder="Search"
                           aria-label="Search">
                </form>
                {% if user.is_authenticated %}
                    <div class="dropdown">
                        <button class="btn dropdown-toggle d-flex align-items-center gap-2"
                                type="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">
                            <span class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center"
                                  style="width: 32px;
                                         height: 32px">{{ user.name|default:user.username|first|upper }}</span>
                            <span class="d-none d-lg-inline">{{ user.name|default:user.username }}</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" href="{% url 'profile' %}">Profile</a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#">Settings</a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="{% url 'account_logout' %}">Log out</a>
                            </li>
                        </ul>
                    </div>
                {% else %}
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-secondary" href="{% url 'account_login' %}">Log in</a>
                        <a class="btn btn-primary" href="{% url 'account_signup' %}">Sign up</a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
