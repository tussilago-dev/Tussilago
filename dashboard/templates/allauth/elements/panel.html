{% load allauth %}
<section class="card mb-3">
    <h5 class="card-header">
        {% slot title %}
    {% endslot %}
</h5>
<div class="card-body">
    {% slot body %}
{% endslot %}
{% if slots.actions %}
    <div class="d-flex gap-2 mt-2">{% for action in slots.actions %}{{ action }}{% endfor %}</div>
{% endif %}
</div>
</section>
