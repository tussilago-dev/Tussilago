services:
  postgres:
    # TODO(TheLovinator): Update to a stable version once available
    image: postgres:19beta3
    container_name: tussilago_postgres

    # TODO(TheLovinator): Find out how much memory is actually needed for the database and adjust accordingly
    shm_size: 1gb
    environment:
      POSTGRES_DB: tussilago
      POSTGRES_USER: tussilago
      POSTGRES_PASSWORD: tussilago
    ports:
      - "35432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tussilago -d tussilago" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: tussilago_redis
    command: redis-server --appendonly yes
    ports:
      - "36379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
